version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
