name: BioCompass Harness CI

on:
  push:
    branches:
      - v2-architecture
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - v2-architecture
      - main

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web SDK & UI (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build @biocompass/plugin-sdk and web/dist
        run: npm run build

  rust:
    name: Rust Workspace (clippy & tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev g++ cmake make
      - name: Setup Node.js 22 (for embedded web/dist)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build embedded web/dist & plugin UI assets
        run: npm ci && npm run build
      - name: Bootstrap offline-bundled DuckDB extensions
        run: ./scripts/install-duckdb-extensions.sh
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo clippy (--all-targets -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test (--workspace)
        run: cargo test --workspace

  publish-bundled-modules:
    name: Publish Bundled Modules (${{ matrix.module }})
    needs:
      - gitleaks
      - web
      - rust
    if: github.event_name == 'push' && (github.ref == 'refs/heads/v2-architecture' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: hla-motif-enrichment
            context: plugins/hla-motif-enrichment
            image: ghcr.io/alitheabio/hla-motif-enrichment
          - module: hla-interactive-explorer
            context: plugins/hla-interactive-explorer
            image: ghcr.io/alitheabio/hla-interactive-explorer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Build and push digest-pinned module image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record canonical @sha256 digest
        run: |
          echo "Published ${{ matrix.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
