name: BioCompass Harness CI

on:
  push:
    branches:
      - v2-architecture
      - main
      - "fix/**"
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - v2-architecture
      - main

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum-pinned binary; the action needs a paid org licence)
        run: |
          curl -sSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Run gitleaks
        run: /tmp/gitleaks git . --redact --no-banner --exit-code 1 --log-opts="fcc0ad462172522aaf5c93a7b2e01f6b9f0b0159..HEAD"

  vuln-scan:
    name: Dependency Vulnerability Gate (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Scan Cargo.lock and package-lock.json (fail on unwaived CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          skip-dirs: target,node_modules,web/node_modules,vendor

  web:
    name: Web SDK & UI (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build @biocompass/plugin-sdk and web/dist
        run: npm run build

  rust:
    name: Rust Workspace (clippy & tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev g++ cmake make
      - name: Setup Node.js 22 (for embedded web/dist)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build embedded web/dist & plugin UI assets
        run: npm ci && npm run build
      - name: Bootstrap offline-bundled DuckDB extensions
        run: ./scripts/install-duckdb-extensions.sh
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - name: Cargo clippy (--all-targets -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test (--workspace)
        run: cargo test --workspace

  module-hla-motif-enrichment:
    name: Bundled Module (hla-motif-enrichment)
    needs:
      - gitleaks
      - vuln-scan
      - web
      - rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/module.yml
    with:
      module_path: plugins/hla-motif-enrichment
      image_name: ghcr.io/alitheabio/hla-motif-enrichment
      use_uv: false
      python_test_command: python3 ../test_sec_20_30_bundled_plugins.py -v
      has_ui: false
      run_gitleaks: false
      publish: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/v2-architecture' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

  module-hla-interactive-explorer:
    name: Bundled Module (hla-interactive-explorer)
    needs:
      - gitleaks
      - vuln-scan
      - web
      - rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/module.yml
    with:
      module_path: plugins/hla-interactive-explorer
      image_name: ghcr.io/alitheabio/hla-interactive-explorer
      use_uv: false
      python_test_command: python3 ../test_sec_20_30_bundled_plugins.py -v
      has_ui: true
      ui_test_command: ""
      ui_in_harness_workspace: true
      run_gitleaks: false
      publish: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/v2-architecture' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
