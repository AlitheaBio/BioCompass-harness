name: E2E (real API)

# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, keeping an
# untrusted fork from exfiltrating the key.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e
    if: >-
      github.event_name != 'pull_request'
      || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
    timeout-minutes: 45
    steps:
      - name: Check API key configuration
        id: api-key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::DEEPSEEK_API_KEY_EXTERNAL is empty. Configure the repository secret before running E2E."
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEEPSEEK_API_KEY_EXTERNAL not configured; skipping live E2E suite."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        if: steps.api-key.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v5.0.0
        if: steps.api-key.outputs.enabled == 'true'

      - uses: actions/setup-node@v7.0.0
        if: steps.api-key.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        if: steps.api-key.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap (unrestrict userns)
        if: steps.api-key.outputs.enabled == 'true'
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build (lib for the e2e example bins)
        if: steps.api-key.outputs.enabled == 'true'
        run: ${{ github.event_name == 'pull_request' && 'pnpm run build:artifacts --profile official' || 'pnpm run build:official' }}

      - name: Prepare primary runtime
        if: steps.api-key.outputs.enabled == 'true'
        run: pnpm run prepare:primary-runtime --target linux-x64 --output .cache/e2e-primary-runtime

      - name: E2E tests
        if: steps.api-key.outputs.enabled == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/anthropic
          DSH_PRIMARY_RUNTIME: ${{ github.workspace }}/.cache/e2e-primary-runtime/primary-runtime
          DSH_E2E_MAX_WORKERS: 6
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
