# Missing-credential patch over the shipped headless profile. The configured
# pi-ai route requires ANTHROPIC_API_KEY and points at an unreachable endpoint.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        baseURL: 'http://127.0.0.1:9'

- id: agent-loop
  config:
    agents:
      - id: main
        provider: anthropic
        model: claude-sonnet-4-5
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
